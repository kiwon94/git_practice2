name: Build Garmin Run Overlay APK

on:
  push:
    branches:
      - chatgpt/garmin-run-overlay-apk-20260916
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK with friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk Garmin-Run-Overlay.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garmin-Run-Overlay-APK
          path: Garmin-Run-Overlay.apk
          if-no-files-found: error
